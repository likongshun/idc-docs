name: Tauri Android 构建
run-name: ${{ github.actor }} 触发打包Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        type: string

# 权限配置
permissions:
  contents: write
  actions: read
  pages: write

# 仓库变量说明（需在 Gitea 仓库设置中配置）：
# KS_STORE_PASSWORD - store密码
# KS_KEY_PASSWORD - key密码  
# KS_KEY_ALIAS - 密钥别名（建议设为 upload）

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 安装 Node.js 和 pnpm
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 安装 pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      # 安装 Rust
      - name: 安装 Rust
        uses: actions/rustup@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      # 安装 Android SDK
      - name: 安装 Android SDK
        run: |
          # 设置 Android SDK 路径
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          
          # 下载命令行工具
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm /tmp/cmdline-tools.zip
          
          # 添加 SDK 工具到 PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          
          # 安装 SDK 组件
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      # 安装 cargo-ndk
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk

      # 配置 Cargo 镜像（清华源）
      - name: 配置 Cargo 镜像
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'tuna-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [net]
          http.timeout = 600
          retry = 10
          git-fetch-with-cli = true
          EOF

      # 安装项目依赖
      - name: 安装项目依赖
        run: pnpm install

      # 构建静态站点
      - name: 构建静态站点
        run: pnpm run docs:build

      # Tauri Android 初始化
      - name: Tauri Android 初始化
        run: |
          pnpm tauri android init
        env:
          RUSTUP_DIST_SERVER: "https://rsproxy.cn"
          RUSTUP_UPDATE_ROOT: "https://rsproxy.cn/rustup"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # 注入自定义安卓文件
      - name: 注入自定义安卓文件
        run: |
          set -e
          ANDROID_APP_DIR="src-tauri/gen/android/app"

          # 1. 覆盖 themes.xml
          cat > "$ANDROID_APP_DIR/src/main/res/values/themes.xml" <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
            <style name="Theme.app" parent="Theme.MaterialComponents.DayNight.NoActionBar">
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>
          </resources>
          EOF

          # 2. 覆盖 MainActivity.kt
          rm -rf "$ANDROID_APP_DIR/src/main/java/com"
          rm -rf "$ANDROID_APP_DIR/src/main/java/top"
          mkdir -p "$ANDROID_APP_DIR/src/main/java/top/liks/docs"
          cat > "$ANDROID_APP_DIR/src/main/java/top/liks/docs/MainActivity.kt" <<'EOF'
          package top.liks.docs

          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import com.tauri.android.TauriActivity

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              
              window?.apply {
                setFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                )
                decorView.systemUiVisibility = (
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                )
              }
            }
          }
          EOF

      # 生成签名密钥文件及配置
      - name: 签名密钥文件生成及配置
        run: |
          set -e
          ANDROID_ROOT="src-tauri/gen/android"
          KS_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KS_DIR"
          
          # 生成 keystore（如果不存在）
          if [ ! -f "$KS_DIR/upload-keystore.p12" ]; then
            keytool -genkey -v \
              -keystore "$KS_DIR/upload-keystore.p12" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "${{ vars.KS_KEY_ALIAS }}" \
              -storepass "${{ vars.KS_STORE_PASSWORD }}" \
              -keypass "${{ vars.KS_KEY_PASSWORD }}" \
              -dname "CN=CI Build, OU=Dev, O=Company, L=City, ST=State, C=CN"
          fi

          # 生成 keystore.properties
          cat > "$ANDROID_ROOT/keystore.properties" <<EOF
          storePassword=${{ vars.KS_STORE_PASSWORD }}
          keyPassword=${{ vars.KS_KEY_PASSWORD }}
          keyAlias=${{ vars.KS_KEY_ALIAS }}
          storeFile=$KS_DIR/upload-keystore.p12
          EOF

      # 配置 Tauri
      - name: 配置 Tauri
        run: |
          cat > src-tauri/tauri.conf.json <<'EOF'
          {
            "$schema": "../node_modules/@tauri-apps/cli/config.schema.json",
            "productName": "运维文档",
            "version": "0.1.0",
            "identifier": "top.liks.docs",
            "build": {
              "frontendDist": "../src/.vuepress/dist/",
              "devUrl": "http://localhost:8080",
              "beforeDevCommand": "pnpm run docs:dev"
            },
            "app": {
              "windows": [
                {
                  "title": "运维文档",
                  "width": 800,
                  "height": 600,
                  "resizable": true,
                  "fullscreen": true
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "app",
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }
          EOF

      # 打包 APK
      - name: 打包 APK
        run: pnpm tauri android build -t aarch64 --apk
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/27.2.12479018

      # 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wzzg_docs_apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
