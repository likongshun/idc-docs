name: Tauri Android 构建
run-name: ${{ github.actor }} 触发打包Android App
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 26.1.109125
          cmake: 3.22.1

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm
            ~/.cargo
            ~/.rustup
            ~/.android
            node_modules
            src-tauri/target
          key: ${{ runner.os }}-tauri-android-${{ hashFiles('**/package.json', '**/Cargo.lock') }}

      - name: 安装项目依赖
        run: |
          pnpm install
          pnpm add -D @tauri-apps/cli

      - name: 构建静态站点
        run: pnpm run docs:build

      - name: Tauri 初始化
        run: |
          pnpm tauri init \
            --ci \
            --app-name "运维文档" \
            --window-title "运维文档" \
            --frontend-dist "../src/.vuepress/dist/" \
            --dev-url "http://localhost:8080" \
            --before-dev-command "pnpm run docs:dev" \
            --before-build-command "pnpm run docs:build"

          # 正确写入 tauri.conf.json（无缩进错误）
          cat > src-tauri/tauri.conf.json <<'EOF'
          {
            "$schema": "../node_modules/@tauri-apps/cli/config.schema.json",
            "productName": "运维文档",
            "version": "0.1.0",
            "identifier": "top.liks.docs",
            "build": {
              "frontendDist": "../src/.vuepress/dist/",
              "devUrl": "http://localhost:8080",
              "beforeDevCommand": "pnpm run docs:dev",
              "beforeBuildCommand": "pnpm run docs:build"
            },
            "app": {
              "windows": [
                {
                  "title": "运维文档",
                  "width": 800,
                  "height": 600,
                  "resizable": true,
                  "fullscreen": true
                }
              ],
              "android": {
                "minSdkVersion": 21
              },
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": ["app"],
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }
          EOF

      - name: Tauri Android 初始化
        run: pnpm tauri android init

      - name: 注入自定义安卓文件（修复所有编译错误）
        run: |
          set -e
          ANDROID_APP_DIR="src-tauri/gen/android/app"

          # 1. 状态栏透明
          cat > "$ANDROID_APP_DIR/src/main/res/values/themes.xml" <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.app" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          # 2. 删除旧包名，写入正确 MainActivity
          rm -rf "$ANDROID_APP_DIR/src/main/java/com"
          rm -rf "$ANDROID_APP_DIR/src/main/java/top"
          mkdir -p "$ANDROID_APP_DIR/src/main/java/top/liks/docs"

          cat > "$ANDROID_APP_DIR/src/main/java/top/liks/docs/MainActivity.kt" <<'EOF'
          package top.liks.docs
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import com.tauri.android.TauriActivity
          
          class MainActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  window?.apply {
                      setFlags(
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                      )
                      decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                      )
                  }
              }
          }
          EOF

      - name: 签名配置
        run: |
          set -e
          ANDROID_ROOT="src-tauri/gen/android"
          KS_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KS_DIR"

          # 生成签名
          keytool -genkey -v \
            -keystore $KS_DIR/upload-keystore.p12 \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass ${{ vars.KS_STORE_PASSWORD }} \
            -keypass ${{ vars.KS_KEY_PASSWORD }} \
            -dname "CN=CI Build, OU=Dev, O=Company, L=City, ST=State, C=CN"

          # 无缩进、正确格式
          cat > "$ANDROID_ROOT/keystore.properties" <<EOF
          storePassword=${{ vars.KS_STORE_PASSWORD }}
          keyPassword=${{ vars.KS_KEY_PASSWORD }}
          keyAlias=${{ vars.KS_KEY_ALIAS }}
          storeFile=$KS_DIR/upload-keystore.p12
          EOF

      - name: 打包 APK
        run: pnpm tauri android build -t aarch64 --apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: wzzg_docs_apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
