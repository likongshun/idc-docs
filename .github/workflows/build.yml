name: Tauri Android 构建
run-name: ${{ github.actor }} 触发打包Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        type: string

# 权限配置
permissions:
  contents: write
  actions: read
  pages: write

# 仓库 Secrets 说明（需在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置）：
# KS_STORE_PASSWORD - store密码
# KS_KEY_PASSWORD - key密码  
# KS_KEY_ALIAS - 密钥别名（建议设为 upload）

env:
  CARGO_HOME: ${{ runner.temp }}/cargo_home
  RUSTUP_HOME: ${{ runner.temp }}/rustup_home
  PNPM_HOME: ${{ runner.temp }}/pnpm
  ANDROID_HOME: ${{ runner.temp }}/android-sdk
  NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/27.2.12479018

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== 缓存配置区域 ==========
      
      # 1. Node.js 模块缓存
      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 2. Rust/Cargo 缓存
      - name: 缓存 Cargo 注册表
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 缓存 Cargo 构建产物
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # 3. Android SDK 缓存
      - name: 缓存 Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: ${{ runner.os }}-android-sdk-34-ndk-27
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # 4. Rust 工具链缓存
      - name: 缓存 Rustup
        id: cache-rustup
        uses: actions/cache@v4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: ${{ runner.os }}-rustup-stable-1.85
          restore-keys: |
            ${{ runner.os }}-rustup-stable-

      # 5. Gradle 缓存（Android 构建）
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ========== 环境安装区域 ==========

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 安装 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          echo "$PNPM_HOME" >> $GITHUB_PATH

      # 安装 Rust
      - name: 安装 Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true
        env:
          RUSTUP_HOME: ${{ env.RUSTUP_HOME }}
          CARGO_HOME: ${{ env.CARGO_HOME }}

      # 设置 Rust 环境变量
      - name: 设置 Rust 环境变量
        run: |
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> $GITHUB_ENV
          echo "CARGO_HOME=$CARGO_HOME" >> $GITHUB_ENV
          cargo --version
          rustc --version

      # 安装 Android SDK（使用缓存）
      - name: 安装 Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          echo "安装 Android SDK（首次运行）..."
          # 下载命令行工具
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm /tmp/cmdline-tools.zip
          
          # 安装 SDK 组件
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 设置 Android SDK PATH
      - name: 设置 Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      # 安装 cargo-ndk
      - name: 安装 cargo-ndk
        run: |
          cargo install cargo-ndk

      # 配置 Cargo 镜像（可选，使用清华源加速）
      - name: 配置 Cargo 镜像
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'tuna-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [net]
          http.timeout = 600
          retry = 10
          git-fetch-with-cli = true
          EOF

      # ========== 构建区域 ==========

      # 安装项目依赖
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      # 构建静态站点
      - name: 构建静态站点
        run: pnpm run docs:build

      # Tauri Android 初始化
      - name: Tauri Android 初始化
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "初始化 Tauri Android 项目..."
            pnpm tauri android init
          else
            echo "Tauri Android 项目已存在，跳过初始化"
          fi
        env:
          RUSTUP_DIST_SERVER: "https://rsproxy.cn"
          RUSTUP_UPDATE_ROOT: "https://rsproxy.cn/rustup"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # 注入自定义安卓文件
      - name: 注入自定义安卓文件
        run: |
          set -e
          ANDROID_APP_DIR="src-tauri/gen/android/app"

          # 确保目录存在
          mkdir -p "$ANDROID_APP_DIR/src/main/res/values"
          mkdir -p "$ANDROID_APP_DIR/src/main/java/top/liks/docs"

          # 1. 覆盖 themes.xml
          cat > "$ANDROID_APP_DIR/src/main/res/values/themes.xml" <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
            <style name="Theme.app" parent="Theme.MaterialComponents.DayNight.NoActionBar">
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>
          </resources>
          EOF

          # 2. 覆盖 MainActivity.kt
          rm -rf "$ANDROID_APP_DIR/src/main/java/com" 2>/dev/null || true
          cat > "$ANDROID_APP_DIR/src/main/java/top/liks/docs/MainActivity.kt" <<'EOF'
          package top.liks.docs

          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import com.tauri.android.TauriActivity

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              
              window?.apply {
                setFlags(
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                )
                decorView.systemUiVisibility = (
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                )
              }
            }
          }
          EOF
          
          echo "自定义 Android 文件已注入"

      # 生成签名密钥文件及配置
      - name: 签名密钥文件生成及配置
        run: |
          set -e
          ANDROID_ROOT="src-tauri/gen/android"
          KS_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KS_DIR"
          
          # 生成 keystore（如果不存在）
          if [ ! -f "$KS_DIR/upload-keystore.p12" ]; then
            echo "生成新的 keystore..."
            keytool -genkey -v \
              -keystore "$KS_DIR/upload-keystore.p12" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "${{ secrets.KS_KEY_ALIAS }}" \
              -storepass "${{ secrets.KS_STORE_PASSWORD }}" \
              -keypass "${{ secrets.KS_KEY_PASSWORD }}" \
              -dname "CN=CI Build, OU=Dev, O=Company, L=City, ST=State, C=CN"
          else
            echo "使用已存在的 keystore"
          fi

          # 生成 keystore.properties
          cat > "$ANDROID_ROOT/keystore.properties" <<EOF
          storePassword=${{ secrets.KS_STORE_PASSWORD }}
          keyPassword=${{ secrets.KS_KEY_PASSWORD }}
          keyAlias=${{ secrets.KS_KEY_ALIAS }}
          storeFile=$KS_DIR/upload-keystore.p12
          EOF
          
          echo "签名配置完成"

      # 配置 Tauri
      - name: 配置 Tauri
        run: |
          cat > src-tauri/tauri.conf.json <<'EOF'
          {
            "$schema": "../node_modules/@tauri-apps/cli/config.schema.json",
            "productName": "运维文档",
            "version": "0.1.0",
            "identifier": "top.liks.docs",
            "build": {
              "frontendDist": "../src/.vuepress/dist/",
              "devUrl": "http://localhost:8080",
              "beforeDevCommand": "pnpm run docs:dev"
            },
            "app": {
              "windows": [
                {
                  "title": "运维文档",
                  "width": 800,
                  "height": 600,
                  "resizable": true,
                  "fullscreen": true
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": "app",
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.icns",
                "icons/icon.ico"
              ]
            }
          }
          EOF
          
          echo "Tauri 配置完成"

      # 打包 APK
      - name: 打包 APK
        run: pnpm tauri android build -t aarch64 --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          GRADLE_USER_HOME: ~/.gradle

      # 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wzzg_docs_apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 30

      # 可选：清理 Gradle 缓存以节省空间
      - name: 清理 Gradle 缓存
        if: always()
        run: |
          rm -rf ~/.gradle/caches/transforms-* 2>/dev/null || true
          rm -rf ~/.gradle/caches/build-cache-* 2>/dev/null || true
